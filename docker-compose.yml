# docker compose up starts everything: the dispute desk, Postgres and the
# PaySwift sandbox. The payswift service is left exactly as it shipped.
services:
  payswift:
    build: ./payswift
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quickdrop
      POSTGRES_PASSWORD: quickdrop
      POSTGRES_DB: disputes
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickdrop -d disputes"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      PAYSWIFT_BASE_URL: http://payswift:8081
      DATABASE_URL: postgresql://quickdrop:quickdrop@postgres:5432/disputes
      # Optional. With no key the agent runs on its deterministic classifier,
      # which is how CI and the eval suite run.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    depends_on:
      postgres:
        condition: service_healthy
      payswift:
        condition: service_started
